name: Update Roadmap.sh Card

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update roadmap card 
        run: |
          python3 -c '
          import re, datetime
          today = datetime.datetime.now().strftime("%Y%m%d")
          with open("README.md", "r") as f: content = f.read()
          
          def update_url(m):
              url = m.group(1)
              url = re.sub(r"[?&]v=\d+", "", url)
              sep = "&" if "?" in url else "?"
              return f"({url}{sep}v={today})"

          new_content = re.sub(r"\((https?://roadmap\.sh/card/[^)]+)\)", update_url, content)
          
          with open("README.md", "w") as f: f.write(new_content)
          '

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status -s) ]]; then
            git add README.md
            git commit -m "Update Roadmap.sh card ($(date +%Y%m%d))"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi