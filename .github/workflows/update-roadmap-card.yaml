name: Update Roadmap.sh Card

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Readme and Push
        run: |
          TODAY=$(date +%Y%m%d)
          
          if grep -q "roadmap.sh/card" README.md; then
            # Replace existing version parameter if it exists
            sed -i -E "s|(roadmap\.sh/card/[^)]+)\?v=[0-9]+|\1?v=$TODAY|g" README.md
            # Append version parameter if it doesn't exist (using ? for first param)
            sed -i -E "s|(roadmap\.sh/card/[^?)]+)(\))|\1?v=$TODAY\2|g" README.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status -s) ]]; then
            git add README.md
            git commit -m "Update Roadmap.sh card cache-buster ($TODAY)"
            git push
          else
            echo "No changes to commit"
          fi